<!doctype html>
<html lang="ja">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
  <meta name="theme-color" content="#f5f5f2">
  <meta name="apple-mobile-web-app-capable" content="yes">
  <meta name="apple-mobile-web-app-status-bar-style" content="default">
  <meta name="apple-mobile-web-app-title" content="テニス乱数表">
  <meta name="mobile-web-app-capable" content="yes">
  <meta name="description" content="テニスのダブルス練習を、公平な組み合わせで。">
  <link rel="manifest" href="./manifest.webmanifest">
  <link rel="icon" type="image/svg+xml" href="./icons/icon.svg">
  <link rel="apple-touch-icon" href="./icons/apple-touch-icon.png">
  <title>テニス乱数表</title>
  <link rel="stylesheet" href="./css/style.css">
  <script type="module" src="./js/app.js?v=20"></script>
</head>
<body>
  <main class="app-shell">
    <header class="site-header"><div class="app-mark" aria-hidden="true">✦</div><div><p class="eyebrow">DOUBLES SESSION</p><h1>テニス乱数表</h1><p class="header-subtitle">今日のダブルスを、スムーズに。</p></div></header>
    <section id="match-screen" class="screen"><section class="section history-section" aria-labelledby="history-title"><div class="section-heading"><h2 id="history-title">試合履歴</h2><span id="history-count" class="section-count"></span></div><div id="history" class="match-list"></div></section><section class="section operations" aria-label="試合操作"><button id="next-match" type="button" class="icon-button primary-icon" aria-label="次の試合を作成" title="次の試合を作成"><span aria-hidden="true">＋</span></button><button id="undo-match" type="button" class="icon-button" aria-label="前の試合を取消" title="前の試合を取消"><span aria-hidden="true">↶</span></button><a class="icon-link" href="#settings" aria-label="プレイヤー設定" title="プレイヤー設定"><span aria-hidden="true">⚙</span></a><a class="icon-link" href="#stats" aria-label="統計" title="統計"><span aria-hidden="true">▥</span></a></section></section>
    <section id="settings-screen" class="screen settings-section" aria-labelledby="settings-title" hidden><a class="back-link" href="#">← 試合画面に戻る</a><div class="section-heading"><h2 id="settings-title">プレイヤー設定</h2></div><div id="settings"></div><button id="new-session" type="button" class="danger-button">新しいセッションを開始</button></section>
    <section id="stats-screen" class="screen stats-section" aria-labelledby="stats-title" hidden><a class="back-link" href="#">← 試合画面に戻る</a><div class="section-heading"><h2 id="stats-title">統計</h2></div><div id="stats"></div></section>
  </main>
</body>
</html>
