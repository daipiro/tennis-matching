<!doctype html>
<html lang="ja">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
  <meta name="theme-color" content="#f5f5f2">
  <meta name="apple-mobile-web-app-capable" content="yes">
  <meta name="apple-mobile-web-app-status-bar-style" content="default">
  <meta name="apple-mobile-web-app-title" content="テニス乱数表">
  <meta name="mobile-web-app-capable" content="yes">
  <meta name="description" content="テニスのダブルス練習を、公平な組み合わせで。">
  <link rel="manifest" href="./manifest.webmanifest">
  <link rel="icon" type="image/svg+xml" href="./icons/icon.svg">
  <link rel="apple-touch-icon" href="./icons/apple-touch-icon.png">
  <title>テニス乱数表</title>
  <link rel="stylesheet" href="./css/style.css">
  <script type="module" src="./js/app.js"></script>
</head>
<body>
  <main class="app-shell">
    <header class="site-header"><div class="app-mark" aria-hidden="true">✦</div><div><p class="eyebrow">DOUBLES SESSION</p><h1>テニス乱数表</h1><p class="header-subtitle">今日のダブルスを、スムーズに。</p></div></header>
    <section class="section history-section" aria-labelledby="history-title"><div class="section-heading"><h2 id="history-title">試合履歴</h2><span id="history-count" class="section-count"></span></div><div id="history" class="match-list"></div><button id="more-history" type="button" class="text-button" hidden>以前の試合を見る</button></section>
    <section class="section" aria-labelledby="current-title"><div class="section-heading"><h2 id="current-title">現在の試合</h2><span id="current-status" class="section-note"></span></div><div id="current"></div></section>
    <section class="section roster-section" aria-labelledby="playing-title"><div class="section-heading"><h2 id="playing-title">出場プレイヤー</h2><span id="playing-count" class="section-count"></span></div><div id="playing" class="roster-list"></div></section>
    <section class="section roster-section" aria-labelledby="resting-title"><div class="section-heading"><h2 id="resting-title">休息プレイヤー</h2><span id="resting-count" class="section-count"></span></div><div id="resting" class="roster-list resting"></div></section>
    <section class="section operations" aria-label="試合操作"><button id="next-match" type="button" class="primary-button">次の試合を作成 <span aria-hidden="true">→</span></button><button id="undo-match" type="button" class="secondary-button">前の試合を取消</button><p id="notice" class="notice" role="status" aria-live="polite"></p></section>
    <section class="section settings-section" aria-labelledby="settings-title"><div class="section-heading"><h2 id="settings-title">プレイヤー設定</h2></div><div id="settings"></div><button id="new-session" type="button" class="danger-button">新しいセッションを開始</button></section>
    <section class="section stats-section" aria-labelledby="stats-title"><div class="section-heading"><h2 id="stats-title">統計</h2></div><div id="stats"></div></section>
  </main>
</body>
</html>
