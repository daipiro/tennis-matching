<!doctype html>
<html lang="ja">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
  <meta name="theme-color" content="#f5f5f2">
  <meta name="apple-mobile-web-app-capable" content="yes">
  <meta name="apple-mobile-web-app-status-bar-style" content="default">
  <meta name="apple-mobile-web-app-title" content="テニス乱数表">
  <meta name="mobile-web-app-capable" content="yes">
  <meta name="description" content="テニスのダブルス練習を、公平な組み合わせで。">
  <link rel="manifest" href="./manifest.webmanifest">
  <link rel="icon" type="image/png" href="./icons/icon-192.png">
  <link rel="apple-touch-icon" href="./icons/apple-touch-icon.png">
  <title>テニス乱数表</title>
  <link rel="stylesheet" href="./css/style.css">
  <style>.match-board .match-card{padding-top:0;padding-bottom:0}.match-board .match-card .teams{margin-top:0;margin-bottom:0}.match-board .match-card+.match-card{padding-top:8px}.match-board .history-section{padding-top:8px;padding-bottom:8px}.match-board .next-match-section{padding-top:8px}.next-card{padding-bottom:8px!important}.next-card .teams{transform:translateX(-28px)}.next-card .match-rest{margin-left:calc(50% - 146px);padding-top:8px}@media(max-width:350px){.next-card .teams{transform:translateX(-24px)}.next-card .match-rest{margin-left:calc(50% - 126px)}}</style>
  <script type="module" src="./js/app.js"></script>
</head>
<body>
  <main class="app-shell">
    <header class="site-header"><div class="app-mark" aria-hidden="true">✦</div><div><p class="eyebrow">DOUBLES SESSION</p><h1>テニス乱数表</h1></div></header>
    <section id="match-screen" class="screen"><div class="match-board"><section class="section history-section" aria-label="試合履歴"><div id="history" class="match-list"></div></section><section class="section next-match-section" aria-label="次の試合"><div id="next-match-preview" class="match-list"></div></section></div><section class="section operations" aria-label="試合操作"><button id="new-session" type="button" class="icon-button session-icon" aria-label="新しいセッションを開始" title="新しいセッションを開始"><svg class="action-icon" viewBox="0 0 24 24" aria-hidden="true" fill="none" stroke="currentColor"><path d="M20 11a8 8 0 1 0-2.34 5.66M20 4v7h-7"/></svg></button><button id="undo-match" type="button" class="icon-button" aria-label="前の試合を取消" title="前の試合を取消"><span aria-hidden="true">−</span></button><button id="next-match" type="button" class="icon-button primary-icon" aria-label="次の試合を作成" title="次の試合を作成"><span aria-hidden="true">＋</span></button><a class="icon-link" href="#settings" aria-label="プレイヤー設定" title="プレイヤー設定"><svg class="action-icon" viewBox="0 0 24 24" aria-hidden="true" fill="none" stroke="currentColor"><circle cx="12" cy="12" r="3"/><path d="M19.4 15a1.65 1.65 0 0 0 .33 1.82l.06.06-2.12 2.12-.06-.06a1.65 1.65 0 0 0-1.82-.33 1.65 1.65 0 0 0-1 1.51V20h-3v-.09a1.65 1.65 0 0 0-1-1.51 1.65 1.65 0 0 0-1.82.33l-.06.06-2.12-2.12.06-.06A1.65 1.65 0 0 0 7.2 14.8a1.65 1.65 0 0 0-1.51-1H5.6v-3h.09a1.65 1.65 0 0 0 1.51-1 1.65 1.65 0 0 0-.33-1.82l-.06-.06L8.93 5.8l.06.06a1.65 1.65 0 0 0 1.82.33h.01a1.65 1.65 0 0 0 1-1.51V4.6h3v.09a1.65 1.65 0 0 0 1 1.51 1.65 1.65 0 0 0 1.82-.33l.06-.06 2.12 2.12-.06.06a1.65 1.65 0 0 0-.33 1.82v.01a1.65 1.65 0 0 0 1.51 1h.09v3h-.09a1.65 1.65 0 0 0-1.51 1Z"/></svg></a></section></section>
    <section id="settings-screen" class="screen settings-section" aria-labelledby="settings-title" hidden><a class="back-link" href="#">← 試合画面に戻る</a><div class="section-heading"><h2 id="settings-title">プレイヤー設定</h2></div><div id="settings"></div><section class="stats-section settings-stats" aria-labelledby="stats-title"><div class="section-heading"><h2 id="stats-title">統計</h2></div><div id="stats"></div></section></section>
  </main>
</body>
</html>
